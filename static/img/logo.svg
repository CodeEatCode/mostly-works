<svg width="260" height="48" viewBox="0 0 260 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Works in Prod</title>
  <desc id="logo-desc">Transparent terminal prompt wordmark reading $ works-in-prod with a production green cursor.</desc>
  <style>
    .word { fill: #111314; }
    @media (prefers-color-scheme: dark) { .word { fill: #E7EEEE; } }
  </style>
  <text x="0" y="32" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="26" font-weight="600" letter-spacing="0"><tspan fill="#0FAF6D">$</tspan><tspan class="word"> works-in-prod</tspan></text>
  <rect x="241" y="9" width="13" height="26" rx="2" fill="#0FAF6D" shape-rendering="crispEdges"/>
</svg>
